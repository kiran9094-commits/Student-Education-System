<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <!-- Geometric Tech Pattern -->
  <g opacity="0.15">
    <circle cx="100" cy="80" r="140" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="700" cy="380" r="200" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path d="M 0 350 Q 200 280 400 350 T 800 320" fill="none" stroke="#a5b4fc" stroke-width="1.5"/>
  </g>
  <!-- Architectural Campus Silhouette -->
  <g transform="translate(100, 120)">
    <!-- Main Hall -->
    <rect x="180" y="80" width="240" height="200" rx="6" fill="url(#buildingGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Glass Dome -->
    <path d="M 250 80 A 50 50 0 0 1 350 80 Z" fill="url(#accentGrad)" opacity="0.8"/>
    <!-- Columns -->
    <rect x="200" y="120" width="16" height="160" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="240" y="120" width="16" height="160" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="280" y="120" width="16" height="160" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="320" y="120" width="16" height="160" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="360" y="120" width="16" height="160" rx="3" fill="#ffffff" opacity="0.3"/>
    <rect x="384" y="120" width="16" height="160" rx="3" fill="#ffffff" opacity="0.3"/>
    <!-- Wings -->
    <rect x="60" y="140" width="120" height="140" rx="4" fill="url(#buildingGrad)" stroke="#6366f1" stroke-width="1"/>
    <rect x="420" y="140" width="120" height="140" rx="4" fill="url(#buildingGrad)" stroke="#6366f1" stroke-width="1"/>
    <!-- Tower -->
    <polygon points="300,10 285,60 315,60" fill="#38bdf8"/>
    <rect x="295" y="60" width="10" height="20" fill="#38bdf8"/>
  </g>
  <!-- Overlay Content -->
  <rect x="0" y="320" width="800" height="130" fill="url(#bgGrad)" opacity="0.9"/>
  <text x="50" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Apex Institute of Technology</text>
  <text x="50" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#93c5fd">Bengaluru, Karnataka • NAAC A++ Autonomous Campus</text>
  <rect x="640" y="360" width="110" height="34" rx="17" fill="url(#accentGrad)"/>
  <text x="695" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">★ 4.8 / 5.0</text>
</svg>
