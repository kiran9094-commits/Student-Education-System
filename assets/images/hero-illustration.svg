<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Glowing Background Orbs -->
  <circle cx="380" cy="180" r="160" fill="url(#orbGrad1)" opacity="0.18" filter="blur(30px)"/>
  <circle cx="180" cy="320" r="140" fill="url(#orbGrad2)" opacity="0.15" filter="blur(30px)"/>

  <!-- Main Floating Card: Verified Institution -->
  <g transform="translate(100, 80)" filter="url(#shadow)">
    <rect width="360" height="230" rx="20" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
    
    <!-- Header of card -->
    <rect x="24" y="24" width="48" height="48" rx="14" fill="#4f46e5"/>
    <path d="M 48 38 L 36 44 L 48 50 L 60 44 Z M 40 48 L 40 54 C 40 57 48 59 48 59 C 48 59 56 57 56 54 L 56 48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    
    <text x="84" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Apex Research University</text>
    <text x="84" y="62" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">NIRF #12 • NAAC A++ Accredited</text>
    
    <!-- Metrics Pills inside card -->
    <rect x="24" y="92" width="98" height="34" rx="8" fill="#f1f5f9"/>
    <text x="73" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">★ 4.8 Rating</text>

    <rect x="130" y="92" width="108" height="34" rx="8" fill="#ecfdf5"/>
    <text x="184" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">98% Placement</text>

    <rect x="246" y="92" width="88" height="34" rx="8" fill="#e0f2fe"/>
    <text x="290" y="113" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">120+ Seats</text>

    <!-- Mini chart bars -->
    <line x1="24" y1="150" x2="334" y2="150" stroke="#f1f5f9" stroke-width="1"/>
    
    <text x="24" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e293b">Avg. Placement Package</text>
    <text x="334" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4f46e5" text-anchor="end">₹18.4 LPA</text>

    <rect x="24" y="196" width="310" height="8" rx="4" fill="#f1f5f9"/>
    <rect x="24" y="196" width="248" height="8" rx="4" fill="url(#orbGrad1)"/>
  </g>

  <!-- Small Floating Badge 1: Instant Counseling -->
  <g transform="translate(40, 270)" filter="url(#shadow)">
    <rect width="210" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="38" cy="37" r="18" fill="#10b981" opacity="0.15"/>
    <circle cx="38" cy="37" r="7" fill="#10b981"/>
    <text x="68" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Free Counseling</text>
    <text x="68" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">50,000+ Students Guided</text>
  </g>

  <!-- Small Floating Badge 2: Verified Syllabus Resource -->
  <g transform="translate(320, 290)" filter="url(#shadow)">
    <rect width="230" height="74" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="38" cy="37" r="18" fill="#f59e0b" opacity="0.15"/>
    <polygon points="38,28 45,43 31,43" fill="#f59e0b"/>
    <text x="68" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Academic Resources</text>
    <text x="68" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Verified Notes &amp; Past Papers</text>
  </g>

  <!-- Floating Achievement Sparkle Dots -->
  <circle cx="90" cy="90" r="4" fill="#38bdf8"/>
  <circle cx="490" cy="120" r="5" fill="#ec4899"/>
  <circle cx="530" cy="270" r="4" fill="#8b5cf6"/>
</svg>
